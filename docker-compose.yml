services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Pub/sub del adaptador de Socket.IO: no guarda datos, por eso no lleva volumen
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  back:
    build: ./back
    restart: unless-stopped
    ports:
      - "7001:7001"
    # Mismo archivo que usa el back sin Docker (JWT_SECRET, SEED_ADMIN_PASSWORD...)
    env_file: ./back/.env
    # Estas tienen prioridad sobre env_file: dentro de Docker Mongo es el servicio "mongo"
    environment:
      MONGO_URI: mongodb://mongo:27017/kuepa_test
      REDIS_URL: redis://redis:6379
      PORT: 7001
      PUBLIC_URL: http://localhost:7001
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  front:
    build:
      context: ./front
      args:
        # La URL la consume el navegador, por eso apunta al puerto publicado en el host
        VITE_API_URL: http://localhost:7001
        VITE_PUBLIC_URL: http://localhost:7001
        # Logto: app SPA "Kuepa CRM" (el App ID es público)
        VITE_LOGTO_ENDPOINT: https://logto.arisma.com.co
        VITE_LOGTO_APP_ID: wpqq5ute5og9jfags2mom
        # Turnstile: site key pública. Esta es la de prueba oficial de Cloudflare (siempre pasa)
        VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - back

volumes:
  mongo_data:
