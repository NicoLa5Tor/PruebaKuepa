# App de producción. No publica puertos: usa la red kuepa_app que crea otp/volume.
# Levantar después de volume. Redis, back y front viven aquí.
name: kuepa-project

services:
  redis:
    image: redis:7-alpine
    container_name: kuepa-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      app:
        aliases:
          - redis

  back:
    build: ../../../back
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017/kuepa_test
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      app:
        aliases:
          - back

  front:
    build:
      context: ../../../front
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_PUBLIC_URL: ${VITE_PUBLIC_URL}
        VITE_LOGTO_ENDPOINT: ${VITE_LOGTO_ENDPOINT}
        VITE_LOGTO_APP_ID: ${VITE_LOGTO_APP_ID}
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY}
    restart: unless-stopped
    depends_on:
      - back
    networks:
      app:
        aliases:
          - front

networks:
  app:
    name: kuepa_app
    external: true
