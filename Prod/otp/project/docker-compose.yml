# App de producción. No publica puertos: usa la red kuepa_app que crea otp/volume.
# Levantar después de volume. Redis, back y front viven aquí.
name: kuepa-project

services:
  redis:
    image: redis:7-alpine
    container_name: kuepa-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      app:
        aliases:
          - redis

  back:
    image: nicoscale/crm-back-kuepa:latest
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017/kuepa_test
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      app:
        aliases:
          - back

  front:
    image: nicoscale/crm-front-kuepa:latest
    restart: unless-stopped
    depends_on:
      - back
    networks:
      app:
        aliases:
          - front

networks:
  app:
    name: kuepa_app
    external: true
