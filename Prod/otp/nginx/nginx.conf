worker_processes auto;

events {
  worker_connections 1024;
}

http {
  resolver 127.0.0.11 valid=10s ipv6=off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # El allow/deny mira la IP de la conexión. Si real_ip la cambia antes,
  # esa IP pasa a ser la del visitante y el filtro la rechaza.
  map $http_cf_connecting_ip $client_ip {
    default $http_cf_connecting_ip;
    ''      $remote_addr;
  }

  server {
    listen 80;

    include /etc/nginx/cloudflare.conf;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $client_ip;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location /api/ {
      set $upstream back:7001;
      proxy_pass http://$upstream;
    }

    location /socket.io/ {
      set $upstream back:7001;
      proxy_pass http://$upstream;
      proxy_read_timeout 3600s;
    }

    location / {
      set $upstream front:80;
      proxy_pass http://$upstream;
    }
  }
}
